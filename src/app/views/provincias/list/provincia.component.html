<app-edit-modal
  [titulo] = '"Provincia"'
  [(isVisible)]="modalVisible"
  [datos]='provincia()'
  [maxValores]='{
    ine: 2,
    nombre: 255
  }'
  (guardar)="guardar($event)"
  [camposMostrar]='{
    ine: true,
  }'
/>

<div class='mb-4'>
  <h1 class='text-2xl font-bold text-slate-800'>Provincias</h1>
</div>

<br />

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>

  <!-- Rejilla de Filtros Inline (Inline-flex forzado) -->
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- INE -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 150px;'>
      <label for='filtro-ine' class='text-xs font-semibold text-slate-600'>INE</label>
      <input
        id='filtro-ine'
        pInputText
        type='text'
        formControlName='ine'
        placeholder='Ej. 01...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Sevilla...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br />

<app-boton-add (add)='abrirModal()' />

<p-table
  appFilasAutoajustables
  (filasChange)='filasPorPagina.set($event)'
  size='small'
  [value]='provincias()'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='filasPorPagina()'
  [rowsPerPageOptions]='opcionesFilasPorPagina'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando()'
  sortField='nombre'
  [sortOrder]='1'
>

  <ng-template pTemplate='header'>
    <tr>
      <th id='provincia.ine' pSortableColumn='ine' style='width: 10%'>INE<p-sortIcon field='ine'></p-sortIcon></th>
      <th id='provincia.nombre' pSortableColumn='nombre'>Nombre<p-sortIcon field='nombre'></p-sortIcon></th>
      <th id='provincia.estado' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
      <th id='provincia.accion' class='text-right' style='width: 10%'></th>
    </tr>
  </ng-template>

  <ng-template pTemplate='emptymessage'>
    <tr>
      <td colspan='100%'>
        <div
          style='display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; padding: 3rem 1rem !important; text-align: center !important; width: 100% !important;'>

          <svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none'
               stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
               style='color: #94a3b8;'>
            <path d='m2 2 20 20' />
            <path d='M8.35 2.69A10 10 0 0 1 21.3 15.65' />
            <path d='M19.08 19.08A10 10 0 1 1 4.92 4.92' />
          </svg>

          <p style='margin-top: 0.75rem; color: #64748b; font-weight: 600; font-size: 0.875rem;'>
            No hay registros para mostrar
          </p>

        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate='body' let-provincia>
    <tr>
      <td>{{ provincia.ine }}</td>
      <td>{{ provincia.nombre }}</td>
      <td class='text-center' style='text-align: center'>
        <label class="switch-native {{ provincia.activo ? 'verde' : 'rojo' }}">
          <input type='checkbox' [checked]='provincia.activo' disabled />
          <span class='slider-native'></span>
        </label>
      </td>
      <app-acciones-tabla
        (editar)="editar(provincia.id)"
        [activo]="provincia.activo"
        (toggleEstado)="cambiarEstado(provincia.id)"
        (borrar)="confirmarBorrado(provincia)"
      />
    </tr>
  </ng-template>

</p-table>
