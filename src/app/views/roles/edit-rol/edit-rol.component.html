<div class='row'>
  <h1>Permisos - {{ nombreRol }}</h1>

  <br />

  <div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
    <div
      style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    </div>
  </div>

  <br />

  <p-table
    size='small'
    [value]='permisos'
    [tableStyle]="{ 'min-width': '50rem' }"
    [stripedRows]='true'
    [paginator]='true'
    [rows]='10'
    [rowsPerPageOptions]='[10, 20, 50, 100]'
    [showCurrentPageReport]='true'
    currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
    dataKey='id'
    [loading]='cargando'
    sortField='nombre'
    [sortOrder]='1'
  >
    <ng-template pTemplate="header">
      <tr>
        <th id='permiso.userName' pSortableColumn="permiso.tipoRol.nombre">UsuarioModel<p-sortIcon field="permiso.tipoRol.nombre"></p-sortIcon></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-permiso>
      <tr>
        <td>{{ permiso.tipoRol.nombre }}</td>
      </tr>
    </ng-template>

  </p-table>

</div>
