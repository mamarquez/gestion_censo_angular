<div class="row">
    <h1>Gestión de estados de uso</h1>
</div>

<br/>

<p-table
  size='small'
  [value]='estadosusos'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='10'
  [rowsPerPageOptions]='[10, 20, 50, 100]'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando'
  sortField='nombre'
  [sortOrder]='1'
>

    <ng-template pTemplate="header">
        <tr>
          <th id='estadouso.nombre' pSortableColumn='nombre'>Nombre<p-sortIcon field='nombre'></p-sortIcon></th>
          <th id='estadouso.descripcion' pSortableColumn='descripcion'>Descripción<p-sortIcon field='descripcion'></p-sortIcon></th>
          <th id='estadouso.estado' class='text-center' style='width: 10%'>Estado</th>
          <th id='estadouso.accion' class='text-right' style='width: 10%'></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4">
                <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
                    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-estadouso>
        <tr>
            <td>{{ estadouso.nombre }}</td>
            <td class="centrado">
              <label class="switch-native {{ estadouso.activo ? 'verde' : 'rojo' }}">
                <input type="checkbox" [checked]="estadouso.activo" disabled />
                <span class="slider-native"></span>
              </label>
            </td>
            <td></td>
        </tr>
    </ng-template>
</p-table>
