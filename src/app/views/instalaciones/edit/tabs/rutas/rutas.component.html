<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <input id="idInstalacion" type="text" pInputText formControlName="idInstalacion" readonly [hidden]='true' />

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Nombre...'
        class='p-inputtext-sm w-full'
        maxlength='500'
      />
    </div>
    <!-- Descripcion -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-descripcion' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-descripcion'
        pInputText
        type='text'
        formControlName='descripcion'
        placeholder='Ej. Descripción...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br/>

<div style='display: flex; justify-content: flex-end; margin-bottom: 1rem;'>
  <p-button
    type='button'
    label='Añadir'
    icon='pi pi-plus'
    styleClass='p-button-primary p-button-sm'>
  </p-button>
</div>

<p-table
  [value]="rutas"
  [tableStyle]="{ 'min-width': '50rem' }"
  [size]="'small'"
  [stripedRows]="true"
  [paginator]="true"
  [rows]="20"
  [rowsPerPageOptions]="[20, 50, 100]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
  dataKey="id"
  [loading]="cargando">

  <ng-template pTemplate="header">
    <tr>
      <th id='ruta.nombre' pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
      <th id='ruta.descripcion' pSortableColumn="descripcion">Descripción<p-sortIcon field="descripcion"></p-sortIcon></th>
      <th id='ruta.visible' pSortableColumn='visible' class='text-center' style='width: 10%'>Visible<p-sortIcon field='visible'></p-sortIcon></th>
      <th id='ruta.activo' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
      <th id='ruta.accion' class='text-right' style='width: 10%'></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">
        <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
          <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-ruta>
    <tr>
      <td>{{ ruta.nombre }}</td>
      <td>{{ ruta.descripcion | truncar:50 }}</td>
      <td class="centrado">
        <label class="switch-native {{ ruta.visible ? 'verde' : 'rojo' }}">
          <input type="checkbox" [checked]="ruta.visible" disabled />
          <span class="slider-native"></span>
        </label>
      </td>
      <td class="centrado">
        <label class="switch-native {{ ruta.activo ? 'verde' : 'rojo' }}">
          <input type="checkbox" [checked]="ruta.activo" disabled />
          <span class="slider-native"></span>
        </label>
      </td>

      <app-acciones-tabla
        (editar)="editar(ruta.id)"
        [activo]="ruta.activo"
        [visible]="ruta.visible"
        (toggleEstado)="cambiarEstado(ruta.id)"
        (toggleVisible)="cambiarVisible(ruta.id)"
        (borrar)="confirmarBorrado(ruta)"
      />

    </tr>
  </ng-template>
</p-table>
