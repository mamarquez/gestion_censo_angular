@if (cargando) {
    <app-loader />
} @else {
    <div [formGroup]="imagenForm">
        <div class="galeria-toolbar">
            <input
                #inputArchivo
                type="file"
                accept="image/png,image/jpeg,image/gif,image/bmp,image/vnd.wap.wbmp"
                hidden
                (change)="onFileSelected($event)"
            />
            <p-button
                severity="success"
                icon="pi pi-upload"
                label="{{ 'Añadir imagen' | translate }}"
                [outlined]="true"
                [style]="{ width: '100%' }"
                (onClick)="inputArchivo.click()"
            ></p-button>
        </div>

        @if (imagenForm.get('contenido')?.value) {
            <div class="galeria-toolbar">
                <input pInputText type="text" formControlName="nombre" placeholder="{{ 'Nombre' | translate }}" class="galeria-toolbar-input" />
                <input pInputText type="text" formControlName="descripcion" placeholder="{{ 'Descripción' | translate }}" class="galeria-toolbar-input" />
                <p-button
                    severity="success"
                    icon="pi pi-check"
                    label="{{ 'Guardar' | translate }}"
                    [loading]="guardando"
                    [disabled]="imagenForm.invalid"
                    (onClick)="guardarImagen()"
                ></p-button>
                <p-button
                    severity="secondary"
                    [text]="true"
                    icon="pi pi-times"
                    label="{{ 'Cancelar' | translate }}"
                    [disabled]="guardando"
                    (onClick)="cancelarImagen()"
                ></p-button>
            </div>
        }
    </div>

    <div class="galeria">
        @for (imagen of imagenes; track imagen.id) {
            <div class="galeria-item">
                <img
                    [src]="imagen.imagenUrl"
                    [alt]="imagen.nombre" width="150"
                    class="galeria-thumb"
                    [class.galeria-thumb-oculta]="imagen.visible === false"
                    (click)="ampliar(imagen)"
                    [pTooltip]="(imagen.descripcion ? imagen.descripcion : imagen.nombre) | translate"
                    />
                <p>
                    @if (imagen.visible !== undefined) {
                        <p-button severity='secondary'
                            [rounded]='true'
                            [text]='true'
                            (onClick)='cambiarEstado(imagen.id)'
                            pTooltip="{{ tooltipVisibilidad(imagen.visible) | translate }}"
                            [tooltipOptions]="{ appendTo: 'body' }"
                        >
                            @if (!imagen.visible) {
                                <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
                                    stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
                                    style='color: green'>
                                <path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z'></path>
                                <circle cx='12' cy='12' r='3'></circle>
                                </svg>
                            } @else {
                                <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
                                    stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
                                    style='color: #94a3b8'>
                                <path d='M9.88 9.88a3 3 0 1 0 4.24 4.24'></path>
                                <path d='M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68'></path>
                                <path d='M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61'></path>
                                <line x1='2' y1='2' x2='22' y2='22'></line>
                                </svg>
                            }
                        </p-button>
                    }

                    <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='confirmarBorrado(imagen)' pTooltip="{{ 'Borrar' | translate }}" [tooltipOptions]="{ appendTo: 'body' }">
                        <svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none'
                            stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
                            style='color: red'>
                            <path d='M3 6h18' />
                            <path d='M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6' />
                            <path d='M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2' />
                            <line x1='10' y1='11' x2='10' y2='17' />
                            <line x1='14' y1='11' x2='14' y2='17' />
                        </svg>
                    </p-button>
                    
                    <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='descargar(imagen.nombre)' pTooltip="{{ 'Exportar' | translate }}" [tooltipOptions]="{ appendTo: 'body' }">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: green">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </p-button>
                </p>
            </div>
        }
    </div>

    <p-dialog
        [visible]="!!imagenAmpliada"
        (visibleChange)="!$event && cerrarAmpliada()"
        [modal]="true"
        [dismissableMask]="true"
        [header]="imagenAmpliada?.nombre"
        [style]="{ maxWidth: '95vw', maxHeight: '95vh' }"
    >
        @if (imagenAmpliada) {
            <img [src]="imagenAmpliada.imagenUrl" [alt]="imagenAmpliada.nombre" class="galeria-ampliada" />
        }
    </p-dialog>
}
