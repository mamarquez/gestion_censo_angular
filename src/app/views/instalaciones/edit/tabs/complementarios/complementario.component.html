<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Nombre...'
        class='p-inputtext-sm w-full'
        maxlength='500'
      />
    </div>
    <!-- Descripcion -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-descripcion' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-descripcion'
        pInputText
        type='text'
        formControlName='descripcion'
        placeholder='Ej. Descripción...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br/>

<div style='display: flex; justify-content: flex-end; margin-bottom: 1rem;'>
  <p-button
    type='button'
    label='Añadir'
    icon='pi pi-plus'
    styleClass='p-button-primary p-button-sm'
    (click)="abrirModal()"
  >
  </p-button>
</div>

<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>


  <form [formGroup]="form">
    <div class="fields-row">
        <div class="field col-3">
          <input id="id" type="text" formControlName="id" readonly [hidden]='true' />
        </div>
    </div>
  </form>

  </div>
</div>


<p-table
  size='small'
  [value]='espaciosComplementarios'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='10'
  [rowsPerPageOptions]='[10, 20, 50, 100]'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando'
  sortField='nombre'
  [sortOrder]='1'
>

  <ng-template pTemplate="header">
    <tr>
      <th id='espacio-deportivo.nombre' pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
      <th id='espacio-deportivo.visible' pSortableColumn='visible' class='text-center' style='width: 10%'>Visible<p-sortIcon field='visible'></p-sortIcon></th>
      <th id='espacio-deportivo.activo' pSortableColumn='activo' class='text-center' style='width: 10%'>Activo<p-sortIcon field='activo'></p-sortIcon></th>
      <th id='espacio-deportivo.accion' class='text-right' style='width: 10%'></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4">
        <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
          <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-espacioComplementario>
    <tr>
      <td>{{ espacioComplementario.espacioComplementario.nombre }}</td>
      <td class="centrado">
        <label for='espacioComplementario-visible-{{ espacioComplementario.id }}' class="switch-native {{ espacioComplementario.visible ? 'verde' : 'rojo' }}">
          <input id='espacioComplementario-visible-{{ espacioComplementario.id }}' type="checkbox" [checked]="espacioComplementario.visible" disabled />
          <span class="slider-native"></span>
        </label>
      </td>
      <td class="centrado">
        <label for='espacioComplementario-activo-{{ espacioComplementario.id }}' class="switch-native {{ espacioComplementario.activo ? 'verde' : 'rojo' }}">
          <input id='espacioComplementario-activo-{{ espacioComplementario.id }}' type="checkbox" [checked]="espacioComplementario.activo" disabled />
          <span class="slider-native"></span>
        </label>
      </td>
      <app-acciones-tabla
        [editarRoute]="['/instalacionesespacios', espacioComplementario.id]"
        [activo]="espacioComplementario.activo"
        [visible]="espacioComplementario.visible"
        (toggleEstado)="cambiarEstado(espacioComplementario.id)"
        (toggleVisible)="cambiarVisible(espacioComplementario.id)"
        (borrar)="confirmarBorrado(espacioComplementario)"
      />
    </tr>
  </ng-template>

</p-table>

<p-toast />
