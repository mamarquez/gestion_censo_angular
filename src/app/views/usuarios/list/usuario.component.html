<div class="row">
    <h1>Usuarios</h1>
</div>

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Nombre...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- 1º Apellido -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-apellido1' class='text-xs font-semibold text-slate-600'>1º Apellido</label>
      <input
        id='filtro-apellido1'
        pInputText
        type='text'
        formControlName='apellido1'
        placeholder='Ej. 1º Apellido...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- 2º Apellido -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-apellido2' class='text-xs font-semibold text-slate-600'>2º Apellido</label>
      <input
        id='filtro-apellido2'
        pInputText
        type='text'
        formControlName='apellido2'
        placeholder='Ej. 2º Apellido...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br/>

<p-table
    [value]="usuarios"
    [tableStyle]="{ 'min-width': '50rem' }"
    [size]="'small'"
    [stripedRows]="true"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[20, 50, 100]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    dataKey="id"
    [loading]="cargando">

    <ng-template pTemplate="header">
        <tr>
          <th id='usuario.userName' pSortableColumn="nombre">Usuario<p-sortIcon field="userName"></p-sortIcon></th>
          <th id='usuario.nombre' pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
          <th id='usuario.apellido1' pSortableColumn="apelldo1">1º Apellido<p-sortIcon field="apelldo1"></p-sortIcon></th>
          <th id='usuario.appelido2' pSortableColumn="apelldo2">2º Apellido<p-sortIcon field="apelldo2"></p-sortIcon></th>
          <th id='usuario.rol' pSortableColumn='roles' class='text-center' style='width: 20%'>Roles<p-sortIcon field='roles'></p-sortIcon></th>
          <th id='usuario.estado' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
          <th id='usuario.acciones' class='text-center' style='width: 7%'></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="7">
                <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
                    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-usuario>
        <tr>
            <td>{{ usuario.username }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.apellido1 }}</td>
            <td>{{ usuario.apellido2 }}</td>
            <td>
              @if(usuario.roles && usuario.roles.length > 0) {
                <ul>
                  @for (rol of usuario.roles; track rol.id) {
                      <p-tag value="{{ rol.nombre }}" severity="info" style="margin-right: 5px;"></p-tag>
                  }
                </ul>
              }
            </td>
            <td class="centrado">
              <label for='check-{{ usuario.id }}' class="switch-native {{ usuario.activo ? 'verde' : 'rojo' }}">
                <input id='check-{{ usuario.id }}' type="checkbox" [checked]="usuario.activo" disabled />
                <span class="slider-native"></span>
              </label>
            </td>
            <app-acciones-tabla
              (editar)="editar(usuario.id)"
              [activo]="usuario.activo"
              (toggleEstado)="cambiarEstado(usuario.id)"
              (borrar)="confirmarBorrado(usuario)"
            />
        </tr>
    </ng-template>
</p-table>
