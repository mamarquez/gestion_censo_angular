@if (cargandoRoles || cargandoProvincias) {
  <app-loader />
} @else {
<form [formGroup]='form' (ngSubmit)='guardar()'>

  <p-fieldset legend="Permisos">
    <p-fluid>

      <div class='fields-row'>
        @for (rol of roles; track rol.id) {
          <div class="field field-checkbox">
            <label class="switch-native {{ tieneRol(rol.id) ? 'verde' : 'rojo' }}">
              <input
                [id]="'rol-' + rol.id"
                type="checkbox"
                [disabled]="tieneRol(1) && rol.id !== 1"
                [checked]="tieneRol(rol.id)"
                (change)="toggleRol(rol.id)"
              />
            <span class="slider-native"></span>
            <span class="sr-only">{{ rol.nombre }}</span>
          </label>
          <label [for]="'rol-' + rol.id">{{ rol.nombre }}</label>
        </div>
      } @empty {
        <p>No hay roles disponibles</p>
      }
      </div>

      <div style="display: flex; align-items: stretch; width: 100%;">
        <!-- Disponibles -->
        <div style="flex: 1;">
          <label for="provincias">Provincias disponibles</label>

          <p-listbox
            id='provincias'
            [options]="provinciasDisponibles"
            optionLabel="nombre"
            [(ngModel)]="provinciasDisponiblesElegidas"
            [ngModelOptions]="{ standalone: true }"
            [multiple]="true"
            [metaKeySelection]="false"
            (onDblClick)="moverAseleccionadas()"
            styleClass="provincias-listbox"
            [style]="{ width: '100%', height: '225px' }"
          />
        </div>

        <!-- Botones -->
        <div style="width: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.5rem;">
          <p-button label="<<" size="small" type="button" (onClick)="moverTodasADisponibles()" />
          <p-button label="<" size="small" type="button" [disabled]="!provinciasSeleccionadasElegidas.length" (onClick)="moverADisponibles()" />
          <p-button label=">" size="small" type="button" [disabled]="!provinciasDisponiblesElegidas.length" (onClick)="moverAseleccionadas()" />
          <p-button label=">>" size="small" type="button" (onClick)="moverTodasASeleccionadas()" />
        </div>

        <!-- Seleccionadas -->
        <div style="flex: 1;">
          <label for="provinciasSeleccionadas">Provincias seleccionadas</label>

          <p-listbox
            id='provinciasSeleccionadas'
            [options]="provinciasSeleccionadas"
            optionLabel="nombre"
            [(ngModel)]="provinciasSeleccionadasElegidas"
            [ngModelOptions]="{ standalone: true }"
            [multiple]="true"
            [metaKeySelection]="false"
            (onDblClick)="moverADisponibles()"
            styleClass="provincias-listbox"
            [style]="{ width: '100%', height: '225px' }"
          />
        </div>
      </div>

      @if (provinciasCargadas && provinciasSeleccionadas.length === 0) {
        <small class="p-error">Debe asignar al menos una provincia.</small>
      }

    </p-fluid>

  </p-fieldset>

  <br />

  <div style='display: flex; justify-content: flex-end; gap: 0.5rem; padding-top: 1rem;'>
    <p-button
      label='Cancelar'
      severity='secondary'
      (onClick)='cancelar()'
    ></p-button>
    <p-button
      type="submit"
      label="Guardar"
      [loading]="guardando"
      [disabled]="!provinciasSeleccionadas.length"
    ></p-button>
  </div>

</form>
}
