<app-edit-modal
  [titulo] = '"Espacio deportivo"'
  [(isVisible)]="modalVisible"
  [datos]='espacioDeportivo'
  [maxValores]='{
    nombre: 255
  }'
  [camposMostrar]='{
    nombre: true,
    activo: true,
    descripcion: true
  }'
  (guardar)="guardar($event)"
/>

<div class="row">
    <h1>Espacios deportivos</h1>
</div>

<br/>

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Nombre...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Descripcion -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 60%;'>
      <label for='filtro-descripcion' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-descripcion'
        pInputText
        type='text'
        formControlName='descripcion'
        placeholder='Ej. Descripción...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br/>

<app-boton-add (add)='abrirModal()' />

<p-table
    [value]="espaciosDeportivos"
    [tableStyle]="{ 'min-width': '50rem' }"
    [size]="'small'"
    [stripedRows]="true"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[20, 50, 100]"
    [showCurrentPageReport]="true"
    [loading]="cargando"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    dataKey="id"
>

    <ng-template pTemplate="header">
        <tr>
            <th id='espaciodeportivo.nombre' pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
            <th id='espaciodeportivo.descripcion' pSortableColumn="descripcion">Descripción<p-sortIcon field="descripcion"></p-sortIcon></th>
            <th id='espaciodeportivo.estado' pSortableColumn="estado" class='text-center' style='width: 10%'>Estado<p-sortIcon field="estado"></p-sortIcon></th>
            <th id='espaciodeportivo.accion' class='text-center' style='width: 10%'></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4">
                <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
                    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-espacioDeportivo>
        <tr>
            <td>{{ espacioDeportivo.nombre }}</td>
            <td>{{ espacioDeportivo.descripcion | truncar:150 }}</td>
            <td class="centrado">
              <label class="switch-native {{ espacioDeportivo.activo ? 'verde' : 'rojo' }}">
                <input type="checkbox" [checked]="espacioDeportivo.activo" disabled />
                <span class="slider-native"></span>
              </label>
            </td>
          <app-acciones-tabla
            (editar)="editar(espacioDeportivo.id)"
            [activo]="espacioDeportivo.activo"
            (toggleEstado)="cambiarEstado(espacioDeportivo.id)"
            (borrar)="confirmarBorrado(espacioDeportivo)"
          />
        </tr>
    </ng-template>
</p-table>
