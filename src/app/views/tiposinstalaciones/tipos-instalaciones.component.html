<app-edit-modal
  [titulo] = "'Tipos de instalaciones'"
  [(isVisible)]="modalVisible"
  [datos]='tipoInstalacion'
  [maxValores]='{
    nombre: 255,
    valor: 255
  }'
  [camposMostrar]="{
    nombre: true,
    descripcion: true,
    valor: true,
    activo: true
  }"
  (guardar)="guardar($event)"
/>

<div class="row">
    <h1>Gestión de tipos de instalaciones</h1>
</div>

<br/>

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Nombre...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Valor -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-valor' class='text-xs font-semibold text-slate-600'>Valor</label>
      <input
        id='filtro-valor'
        pInputText
        type='text'
        formControlName='valor'
        placeholder='Ej. Valor...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br />

<app-boton-add (add)='abrirModal()' />

<p-table
  size='small'
  [value]='tiposInstalaciones'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='10'
  [rowsPerPageOptions]='[10, 20, 50, 100]'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando'
  sortField='nombre'
  [sortOrder]='1'
>

    <ng-template pTemplate="header">
        <tr>
          <th id='tipo-instalacion.nombre' pSortableColumn='nombre'>Nombre<p-sortIcon field='nombre'></p-sortIcon></th>
          <th id='tipo-instalacion.valor' pSortableColumn='valor'>Valor<p-sortIcon field='valor'></p-sortIcon></th>
          <th id='tipo-instalacion.estado' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
          <th id='tipo-instalacion.accion' class='text-right' style='width: 10%'></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4">
                <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
                    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-tipoInstalacion>
        <tr>
          <td>{{ tipoInstalacion.nombre }}</td>
          <td>{{ tipoInstalacion.valor }}</td>
          <td class='centrado'>
            <label class="switch-native {{ tipoInstalacion.activo ? 'verde' : 'rojo' }}">
              <input type='checkbox' [checked]='tipoInstalacion.activo' disabled />
              <span class='slider-native'></span>
            </label>
          </td>

          <app-acciones-tabla
            (editar)="editar(tipoInstalacion.id)"
            [activo]="tipoInstalacion.activo"
            (toggleEstado)="cambiarEstado(tipoInstalacion.id)"
            (borrar)="confirmarBorrado(tipoInstalacion)"
          />
        </tr>
    </ng-template>
</p-table>
