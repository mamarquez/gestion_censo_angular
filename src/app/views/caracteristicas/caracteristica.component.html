<div class='row'>
  <h1>Gestión de características</h1>
</div>

<br />

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>

  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Altura...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Descripcion -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-descripcion' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-descripcion'
        pInputText
        type='text'
        formControlName='descripcion'
        placeholder='Ej. Descripción...'
        class='p-inputtext-sm w-full'
      />
    </div>

  </div>

  <!-- Botones forzados por estilo en línea para evitar conflictos de CSS global -->
  <div
    style='display: flex !important; justify-content: flex-end !important; align-items: center !important; gap: 0.5rem !important; margin-top: 1.5rem !important; padding-top: 1rem !important; border-top: 1px solid #e2e8f0 !important; width: 100% !important;'>
    <p-button
      icon='pi pi-filter-slash'
      styleClass='p-button-outlined p-button-secondary p-button-sm'
      (onClick)='limpiar()'
    >
    </p-button>
    <p-button
      type='button'
      icon='pi pi-search'
      styleClass='p-button-primary p-button-sm'
      (onClick)='buscar()'
    >
    </p-button>
  </div>

</div>

<br />

<p-table
  size='small'
  [value]='caracteristicas'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='10'
  [rowsPerPageOptions]='[10, 20, 50, 100]'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando'
  sortField='nombre'
  [sortOrder]='1'
>

  <ng-template pTemplate='header'>
    <tr>
      <th id='caracteristica.nombre' pSortableColumn='nombre'>Nombre<p-sortIcon field='nombre'></p-sortIcon></th>
      <th id='caracteristica.descripcion' pSortableColumn='descripcion'>Descripción<p-sortIcon field='descripcion'></p-sortIcon></th>
      <th id='caracteristica.estado' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
      <th id='caracteristica.accion' class='text-right' style='width: 10%'></th>
    </tr>
  </ng-template>

  <ng-template pTemplate='emptymessage'>
    <tr>
      <td colspan='4'>
        <div style='display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;'>
          <svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none'
               stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
               class='lucide lucide-circle-off-icon lucide-circle-off'>
            <path d='m2 2 20 20' />
            <path d='M8.35 2.69A10 10 0 0 1 21.3 15.65' />
            <path d='M19.08 19.08A10 10 0 1 1 4.92 4.92' />
          </svg>
          <p style='margin-top: 1rem; color: #64748b; font-weight: 600;'>No hay registros para mostrar</p>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate='body' let-caracteristica>
    <tr>
      <td>{{ caracteristica.nombre }}</td>
      <td>{{ caracteristica.descripcion }}</td>
      <td class='centrado'>
        <label class="switch-native {{ caracteristica.activo ? 'verde' : 'rojo' }}">
          <input type='checkbox' [checked]='caracteristica.activo' disabled />
          <span class='slider-native'></span>
        </label>
      </td>
      <app-acciones-tabla
        [editarRoute]="['/caracteristicas', caracteristica.id]"
        [activo]="caracteristica.activo"
        (toggleEstado)="cambiarEstado(caracteristica.id)"
        (borrar)="confirmarBorrado(caracteristica)"
      />
    </tr>
  </ng-template>
</p-table>
