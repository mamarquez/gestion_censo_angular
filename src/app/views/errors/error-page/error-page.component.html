<div class="error-page">
  <div class="error-card">

    <div class="error-icon">
      <i [class]="icono()"></i>
    </div>

    <p class="error-codigo">{{ codigo() }}</p>

    <h1 class="error-titulo">{{ titulo() }}</h1>

    <p class="error-mensaje">{{ mensaje() }}</p>

    <div class="error-acciones">
      @if (mostrarVolverAtras()) {
        <p-button
          type="button"
          label="Volver atrás"
          severity="secondary"
          [outlined]="true"
          (onClick)="volverAtras()"
        ></p-button>
      }

      <p-button
        type="button"
        [label]="textoBotonInicio()"
        [routerLink]="enlaceInicio()"
      ></p-button>
    </div>

  </div>
</div>
