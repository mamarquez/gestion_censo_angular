<app-edit-modal
  [titulo] = '"Menu"'
  [(isVisible)]="modalVisible"
  [datos]='menu'
  [maxValores]='{
    nombre: 255
  }'
  [camposMostrar]='{
    nombre: true,
    descripcion: true,
    enlace: true,
    visible: true,
    activo: true
  }'
  (guardar)="guardar($event)"
/>

<div class="row">
    <h1>Menús</h1>
</div>

<br/>

<!-- Contenedor principal del filtro -->
<div class='bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6' [formGroup]='form'>
  <div
    style='display: flex !important; flex-direction: row !important; align-items: flex-end !important; gap: 1rem !important; flex-wrap: wrap !important;'>

    <!-- Nombre -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-nombre' class='text-xs font-semibold text-slate-600'>Nombre</label>
      <input
        id='filtro-nombre'
        pInputText
        type='text'
        formControlName='nombre'
        placeholder='Ej. Usuarios...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Descripcion -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-descripcion' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-descripcion'
        pInputText
        type='text'
        formControlName='descripcion'
        placeholder='Ej. Menú de...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <!-- Enlace -->
    <div style='display: flex; flex-direction: column; gap: 0.375rem; width: 250px;'>
      <label for='filtro-enlace' class='text-xs font-semibold text-slate-600'>Descripción</label>
      <input
        id='filtro-enlace'
        pInputText
        type='text'
        formControlName='enlace'
        placeholder='Ej. Enlace a...'
        class='p-inputtext-sm w-full'
      />
    </div>

    <div style="display: flex !important; align-items: flex-end !important; gap: 0.5rem !important; margin-left: auto !important;">
      <p-button
        icon='pi pi-filter-slash'
        styleClass='p-button-outlined p-button-secondary p-button-sm'
        (onClick)='limpiar()'>
      </p-button>
      <p-button
        type='button'
        icon='pi pi-search'
        styleClass='p-button-primary p-button-sm'
        (onClick)='buscar()'>
      </p-button>
    </div>

  </div>

</div>

<br />

<div style='display: flex; justify-content: flex-end; margin-bottom: 1rem;'>
  <p-button
    type='button'
    label='Añadir'
    icon='pi pi-plus'
    styleClass='p-button-primary p-button-sm'
    (onClick)='abrirModal()'>
  </p-button>
</div>

<p-table
  appFilasAutoajustables
  (filasChange)='filasPorPagina = $event'
  size='small'
  [value]='menus'
  [tableStyle]="{ 'min-width': '50rem' }"
  [stripedRows]='true'
  [paginator]='true'
  [rows]='filasPorPagina'
  [rowsPerPageOptions]='opcionesFilasPorPagina'
  [showCurrentPageReport]='true'
  currentPageReportTemplate='Mostrando {first} a {last} de {totalRecords} registros'
  dataKey='id'
  [loading]='cargando'
  sortField='nombre'
  [sortOrder]='1'
>

    <ng-template pTemplate="header">
        <tr>
          <th id='menu.nombre' pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
          <th id='menu.descripcion' pSortableColumn="descripcion">Descripción<p-sortIcon field="descripcion"></p-sortIcon></th>
          <th id='menu.enlace' pSortableColumn="enlace">Enlace<p-sortIcon field="enlace"></p-sortIcon></th>
          <th id='menu.visible' pSortableColumn="visible">Visible<p-sortIcon field="visible"></p-sortIcon></th>
          <th id='menu.estado' pSortableColumn='activo' class='text-center' style='width: 10%'>Estado<p-sortIcon field='activo'></p-sortIcon></th>
          <th id='menu.accion' class='text-right' style='width: 10%'></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="6">
                <div style="display: flex; flex-direction: column; align-items: center; padding: 3rem; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-off-icon lucide-circle-off"><path d="m2 2 20 20"/><path d="M8.35 2.69A10 10 0 0 1 21.3 15.65"/><path d="M19.08 19.08A10 10 0 1 1 4.92 4.92"/></svg>
                    <p style="margin-top: 1rem; color: #64748b; font-weight: 600;">No hay registros para mostrar</p>
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-menu>
        <tr>
            <td>{{ menu.nombre }}</td>
            <td>{{ menu.descripcion | truncar: 150 }}</td>
            <td>{{ menu.enlace | truncar: 150 }}</td>
            <td class="centrado">
                <label class="switch-native {{ menu.visible ? 'verde' : 'rojo' }}">
                    <input id="menu-visible-{{menu.id}}" type="checkbox" [checked]="menu.visible" disabled />
                    <span class="slider-native"></span>
                </label>
            </td>
            <td class="centrado">
                <label class="switch-native {{ menu.activo ? 'verde' : 'rojo' }}">
                    <input id="menu-activo-{{menu.id}}" type="checkbox" [checked]="menu.activo" disabled />
                    <span class="slider-native"></span>
                </label>
            </td>
            <app-acciones-tabla
              (editar)="editar(menu.id)"
              [activo]="!menu.baja"
              [visible]="menu.visible"
              (toggleVisible)="cambiarVisible(menu.id)"
              (toggleEstado)="cambiarEstado(menu.id)"
              (borrar)="confirmarBorrado(menu)"
            />
        </tr>
    </ng-template>
</p-table>
