<td style='display: flex !important; justify-content: flex-end !important; align-items: center !important; gap: 0.25rem !important;'>
  <p-button severity='secondary' [rounded]='true' [text]='true' [routerLink]='editarRoute'>
    <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
         stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
      <path d='M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'></path>
    </svg>
  </p-button>

  <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='toggleEstado.emit()'>
    @if (activo) {
      <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
           stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
           style='color: blue'>
        <rect x='6' y='6' width='12' height='12' rx='2'></rect>
      </svg>
    } @else {
      <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
           stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
           style='color: green'>
        <polygon points='6 3 20 12 6 21 6 3'></polygon>
      </svg>
    }
  </p-button>

  <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='borrar.emit()'>
    <svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none'
         stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
         style='color: red'>
      <path d='M3 6h18' />
      <path d='M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6' />
      <path d='M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2' />
      <line x1='10' y1='11' x2='10' y2='17' />
      <line x1='14' y1='11' x2='14' y2='17' />
    </svg>
  </p-button>
</td>
