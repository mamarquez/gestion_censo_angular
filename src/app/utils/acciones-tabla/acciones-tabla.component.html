<td style='display: flex !important; justify-content: flex-end !important; align-items: center !important; gap: 0.25rem !important;'>
  <p-button severity='secondary' [rounded]='true' [text]='true' [routerLink]='editarRoute'>
    <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
         stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
      <path d='M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'></path>
    </svg>
  </p-button>

  @if (visible !== undefined) {
    <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='toggleVisible.emit()'>
      @if (visible) {
        <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
             stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
             style='color: green'>
          <path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z'></path>
          <circle cx='12' cy='12' r='3'></circle>
        </svg>
      } @else {
        <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
             stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
             style='color: #94a3b8'>
          <path d='M9.88 9.88a3 3 0 1 0 4.24 4.24'></path>
          <path d='M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68'></path>
          <path d='M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61'></path>
          <line x1='2' y1='2' x2='22' y2='22'></line>
        </svg>
      }
    </p-button>
  }

  @if (activo !== undefined) {
    <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='toggleEstado.emit()'>
      @if (activo) {
        <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
             stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
             style='color: blue'>
          <rect x='6' y='6' width='12' height='12' rx='2'></rect>
        </svg>
      } @else {
        <svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none'
             stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
             style='color: green'>
          <polygon points='6 3 20 12 6 21 6 3'></polygon>
        </svg>
      }
    </p-button>
  }

  <p-button severity='secondary' [rounded]='true' [text]='true' (onClick)='borrar.emit()'>
    <svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none'
         stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'
         style='color: red'>
      <path d='M3 6h18' />
      <path d='M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6' />
      <path d='M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2' />
      <line x1='10' y1='11' x2='10' y2='17' />
      <line x1='14' y1='11' x2='14' y2='17' />
    </svg>
  </p-button>
</td>
