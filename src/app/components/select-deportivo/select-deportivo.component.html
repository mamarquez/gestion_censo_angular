<p-select
  inputId="deportivo-select"
  [options]="tiposInstalaciones()"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona un tipo de espacio deportivo"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  [loading]="cargando()"
  styleClass="w-full"
  [style]="{'width': '100%'}"
  appendTo="body"
></p-select>
