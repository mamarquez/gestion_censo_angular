<p-dialog
  header='Característica'
  [(visible)]='isVisible'
  [modal]='true'
  [draggable]='false'
  [resizable]='false'
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '640px': '90vw' }"
>

  <form [formGroup]='form'>

    <div class='fields-row'>
      <div class='field col-12'>
        <label for='caracteristica-select'>Característica</label>
        <app-select-caracteristica formControlName='caracteristica' />
        @if (form.get('caracteristica')?.invalid && form.get('caracteristica')?.touched) {
          <small class='p-error'>La característica es obligatoria</small>
        }
      </div>
    </div>

    <div class='fields-row'>
      <div class='field col-12'>
        <label for='medida-select'>Medida</label>
        <app-select-medida formControlName='medida' />
      </div>
    </div>

    <div class='fields-row'>
      <div class='field col-12'>
        <label for='valor'>Valor</label>
        <input
          id='valor'
          type='number'
          pInputText
          formControlName='valor'
          [class.ng-invalid]="form.get('valor')?.invalid && form.get('valor')?.touched"
        />
        @if (form.get('valor')?.invalid && form.get('valor')?.touched) {
          <small class='p-error'>El valor es obligatorio</small>
        }
      </div>
    </div>

    <div class='fields-row'>
      <div class='field col-6'>
        <div class='field field-checkbox'>
          <label
            class='switch-native'
            [class.verde]="form.get('visible')?.value"
            [class.rojo]="!form.get('visible')?.value"
          >
            <input id='modal-caracteristica-visible' type='checkbox' formControlName='visible' />
            <span class='slider-native'></span>
            <span class='sr-only'>Visible</span>
          </label>
          <label for='modal-caracteristica-visible'>Visible</label>
        </div>
      </div>
    </div>

  </form>

  <ng-template #footer>

    <p-button
      label='Cancelar'
      severity='secondary'
      [text]='true'
      (onClick)='cerrarModal()'>
    </p-button>

    <p-button
      label='Guardar'
      [loading]='guardando'
      [disabled]='form.invalid'
      (onClick)='guardarModal()'>
    </p-button>

  </ng-template>

</p-dialog>
