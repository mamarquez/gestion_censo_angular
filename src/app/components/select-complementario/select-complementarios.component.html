<p-select
  inputId="complementario-select"
  [options]="espaciosComplementarios()"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona un espacio complementario"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  [loading]="cargando()"
  styleClass="w-full"
  [style]="{'width': '100%'}"
  appendTo="body"
></p-select>
