<label for='municipio-select'>Municipios</label>
<p-select
  inputId="municipio-select"
  [options]="municipios"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona una provincia"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  (onClear)="limpiar()"
  (onBlur)="onTouched()"
  [disabled]="disabled()"
  [loading]="cargandoMunicipios"
  [showClear]="value !== null"
  [virtualScroll]="true"
  [virtualScrollItemSize]="38"
  [filter]="true"
  filterBy="nombre"
  styleClass="w-full"
  [style]="{'width': '100%'}"
></p-select>
