<p-select
  inputId="medida-select"
  [options]="medidas()"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona una medida"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  [loading]="cargando()"
  styleClass="w-full"
  [style]="{'width': '100%'}"
  appendTo="body"
></p-select>
