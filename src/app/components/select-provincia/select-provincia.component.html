<label for='provincia-select'>Provincia</label>
<p-select
  inputId="provincia-select"
  [options]="provincias"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona una provincia"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  (onBlur)="onTouched()"
  [disabled]="disabled()"
  [loading]="cargandoProvincias"
  styleClass="w-full"
  [style]="{'width': '100%'}"
></p-select>
