<label for="provincia-select" class="block mb-1 font-semibold">Provincia</label>

<p-select
  inputId="provincia-select"
  [options]="provincias"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona una provincia"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  (onBlur)="onTouched()"
  [disabled]="disabled()"
  [loading]="cargandoProvincias"
  [filter]="true"
  filterBy="nombre"
  [showClear]="true"
  styleClass="w-full"
></p-select>
