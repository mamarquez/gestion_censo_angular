<span id='provincia-select-label'>Provincia</span>
<p-select
  [ariaLabelledBy]="'provincia-select-label'"
  [options]="provincias"
  optionLabel="nombre"
  optionValue="id"
  placeholder="Selecciona una provincia"
  [ngModel]="value"
  (onChange)="seleccionar($event)"
  (onClear)="limpiar()"
  (onBlur)="onTouched()"
  [disabled]="disabled()"
  [loading]="cargandoProvincias"
  [showClear]="value !== null"
  styleClass="w-full"
  [style]="{'width': '100%'}"
></p-select>
